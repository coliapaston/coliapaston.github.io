<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ke Dong's research homepage, documentation hub, and interactive project playgrounds."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Ke Dong</title>
    <script>
      (function (location) {
        if (location.search.startsWith("?/")) {
          const restored = location.search
            .slice(2)
            .split("&")
            .map(function (part) { return part.replace(/~and~/g, "&"); })
            .join("?");
          window.history.replaceState(null, "", "/" + restored + location.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
