<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      const path = window.location.pathname.slice(1).replace(/&/g, "~and~");
      const query = window.location.search.replace(/&/g, "~and~");
      window.location.replace("/?/" + path + query + window.location.hash);
    </script>
  </head>
  <body></body>
</html>
